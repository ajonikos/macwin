<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 18 18" width="18" height="18">
  <title>Menu bar / tray glyph (template: black on transparent)</title>
  <defs>
    <clipPath id="screen"><rect x="1.25" y="2.25" width="15.5" height="10.5" rx="2.25"/></clipPath>
    <path id="arrow" transform="translate(7.7 4.9)" d="M0 0 V 7.6 L 1.92 5.76 L 3.36 8.64 L 4.4 8.16 L 2.96 5.36 L 5.44 5.36 Z"/>
    <mask id="cut">
      <rect width="18" height="18" fill="#FFFFFF"/>
      <use href="#arrow" fill="#000000" stroke="#000000" stroke-width="2.4" stroke-linejoin="round"/>
    </mask>
  </defs>
  <g mask="url(#cut)">
    <rect x="0" y="0" width="9" height="18" fill="#000000" clip-path="url(#screen)"/>
    <g fill="none" stroke="#000000" stroke-width="1.5" stroke-linecap="round">
      <rect x="1.25" y="2.25" width="15.5" height="10.5" rx="2.25"/>
      <path d="M 6 15.75 H 12"/>
    </g>
  </g>
  <use href="#arrow" fill="none" stroke="#000000" stroke-width="1.1" stroke-linejoin="round"/>
</svg>
